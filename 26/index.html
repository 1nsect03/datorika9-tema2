<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #ffe600;
  color: #ff1100;
}

h1 {
  color: #222222;
}

.noteikumi {
  background-color: #ffc400;
  color: #ff0000;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px solid #ff2fa1;
  background-color: #020202;
  box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
}

button {
  background-color: #fcc309;
  color: #fd0707;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>BREAKPOINT</h1>
<p>BREAKPOINT is a game about breaking things and keeping the score high</p>
<section class="noteikumi">
  <h2>Break stuff</h2>
  <p>break things to score points</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/pumking from BREAKPOINT.png" alt="Pumking" width="128">
  <p>smash:</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
